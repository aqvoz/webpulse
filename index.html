<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gudov — Webpulse Engine</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,300;0,400;0,600;0,700;1,400&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-black: #04060a;
            --accent-cyan: #00f0ff;
            --accent-maroon: #800020;
            --accent-magenta: #ff0055;
            --accent-glow: rgba(0, 240, 255, 0.4);
            --border-tech: rgba(0, 240, 255, 0.25);
            --card-dark: rgba(8, 12, 20, 0.85);
            --text-primary: #f1f5f9;
            --text-dim: #64748b;
        }

        /* Theme Variants */
        body.theme-light {
            --bg-black: #e2e8f0;
            --card-dark: rgba(255, 255, 255, 0.85);
            --text-primary: #0f172a;
            --text-dim: #475569;
            --border-tech: rgba(0, 150, 255, 0.3);
            --accent-cyan: #0066ff;
        }

        body.theme-maroon {
            --accent-cyan: #ff2a6d;
            --border-tech: rgba(255, 0, 85, 0.35);
            --accent-glow: rgba(255, 0, 85, 0.4);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-black);
            color: var(--text-primary);
            font-family: 'Space Grotesk', system-ui, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow: hidden;
            position: relative;
            transition: background-color 0.3s ease;
        }

        /* Particle Wave Canvas */
        #particle-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Top HUD Header */
        .top-bar {
            width: 100%;
            padding: 1.5rem 2.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-tag {
            display: flex;
            align-items: center;
            gap: 0.75rem;
            font-family: 'JetBrains Mono', monospace;
            font-weight: 700;
            font-size: 1rem;
            letter-spacing: 0.12em;
            color: var(--accent-cyan);
            text-transform: uppercase;
        }

        .brand-dot {
            width: 8px;
            height: 8px;
            background: var(--accent-cyan);
            border-radius: 50%;
            box-shadow: 0 0 12px var(--accent-cyan);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.75); }
        }

        .hud-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .hud-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            background: var(--card-dark);
            border: 1px solid var(--border-tech);
            padding: 0.5rem 1rem;
            border-radius: 4px;
            backdrop-filter: blur(12px);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }

        .hud-clock {
            color: var(--text-primary);
            font-weight: 700;
            letter-spacing: 0.05em;
        }

        .weather-val {
            color: var(--accent-cyan);
            font-weight: 600;
        }

        /* Main Center Search Area */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 680px;
            padding: 2rem;
            z-index: 10;
        }

        .tech-status-line {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            color: var(--text-dim);
            margin-bottom: 1.5rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .tech-status-line span {
            color: var(--accent-cyan);
        }

        /* Tech Cyber Search Card */
        .search-card {
            width: 100%;
            background: var(--card-dark);
            border: 1px solid var(--border-tech);
            padding: 0.5rem;
            border-radius: 6px;
            backdrop-filter: blur(20px);
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            position: relative;
            transition: all 0.3s ease;
        }

        .search-card::before {
            content: '';
            position: absolute;
            top: -1px; left: -1px; width: 8px; height: 8px;
            border-top: 2px solid var(--accent-cyan);
            border-left: 2px solid var(--accent-cyan);
        }

        .search-card::after {
            content: '';
            position: absolute;
            bottom: -1px; right: -1px; width: 8px; height: 8px;
            border-bottom: 2px solid var(--accent-cyan);
            border-right: 2px solid var(--accent-cyan);
        }

        .search-card:focus-within {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 30px var(--accent-glow);
        }

        .engine-select {
            background: rgba(0, 240, 255, 0.06);
            border: 1px solid var(--border-tech);
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 700;
            padding: 0.6rem 0.8rem;
            border-radius: 4px;
            outline: none;
            cursor: pointer;
            letter-spacing: 0.05em;
        }

        .engine-select option {
            background: #080c14;
            color: #fff;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem 0.5rem;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 1.05rem;
            font-family: 'Space Grotesk', sans-serif;
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-dim);
        }

        /* Pop-up Launcher Trigger */
        .launch-btn {
            margin-top: 2rem;
            background: rgba(0, 240, 255, 0.04);
            border: 1px solid var(--border-tech);
            color: var(--accent-cyan);
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 0.8rem 1.8rem;
            border-radius: 4px;
            cursor: pointer;
            letter-spacing: 0.12em;
            transition: all 0.2s ease;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .launch-btn:hover {
            background: var(--accent-cyan);
            color: #04060a;
            box-shadow: 0 0 25px var(--accent-glow);
            transform: translateY(-2px);
        }

        /* Modal Pop-up Launcher */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(4, 6, 10, 0.88);
            backdrop-filter: blur(14px);
            z-index: 100;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--card-dark);
            border: 1px solid var(--border-tech);
            width: 90%;
            max-width: 540px;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.95);
            transform: scale(0.95);
            transition: transform 0.25s ease;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-tech);
            padding-bottom: 0.75rem;
        }

        .modal-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            color: var(--accent-cyan);
            letter-spacing: 0.1em;
        }

        .close-btn {
            background: transparent;
            border: none;
            color: var(--text-dim);
            font-size: 1.25rem;
            cursor: pointer;
        }

        .close-btn:hover { color: var(--accent-cyan); }

        /* Themes Switcher Grid */
        .theme-section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            margin-bottom: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.08em;
        }

        .theme-buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 0.5rem;
            margin-bottom: 1.75rem;
        }

        .theme-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border-tech);
            color: var(--text-primary);
            padding: 0.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            border-radius: 4px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .theme-btn:hover {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        /* Aligned Shortcuts Grid */
        .popup-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.85rem;
        }

        .tech-tile {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid var(--border-tech);
            padding: 0.85rem 1rem;
            border-radius: 6px;
            text-decoration: none;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
        }

        .tech-tile:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.08);
            transform: translateY(-2px);
        }

        .tile-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .tile-icon {
            width: 20px;
            height: 20px;
            fill: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .tile-name {
            font-family: 'Space Grotesk', sans-serif;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .tile-code {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--accent-cyan);
        }

        .footer-bar {
            padding: 1.5rem;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--text-dim);
            z-index: 10;
        }
    </style>
</head>
<body class="theme-dark">

    <canvas id="particle-canvas"></canvas>

    <!-- Top HUD Bar -->
    <div class="top-bar">
        <div class="brand-tag">
            <div class="brand-dot"></div>
            <span>GUDOV // WEBPULSE</span>
        </div>
        
        <div class="hud-right">

            <div class="hud-box">

            <span>[ // LAUNCH NODES & CONFIG ]</span>
        </button>
    </div>

    <!-- Launcher & Config Pop-up Modal -->
    <div class="modal-overlay" id="shortcut-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">// SYSTEM_CONTROL_PANEL</span>
                <button class="close-btn" id="close-modal-btn">✕</button>
            </div>

            <!-- Appearance Theme Switcher -->
            <div class="theme-section-title">// APPEARANCE_THEME</div>
            <div class="theme-buttons">
                <button class="theme-btn" onclick="setTheme('dark')">Dark Mode</button>
                <button class="theme-btn" onclick="setTheme('light')">Light Mode</button>
                <button class="theme-btn" onclick="setTheme('cyan')">Cyan Pulse</button>
                <button class="theme-btn" onclick="setTheme('maroon')">Maroon Cyber</button>
            </div>

            <!-- Pinned Shortcuts with Clean SVG Icons -->
            <div class="theme-section-title">// PINNED_NODES</div>
            <div class="popup-grid">
                <a href="https://github.com" class="tech-tile">

                        <svg class="tile-icon" viewBox="0 0 24 24"><path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/></svg>
                        <span class="tile-name">GitHub</span>
                    </div>

                </a>
                <a href="https://reddit.com" class="tech-tile">
                    <div class="tile-left">
                        <svg class="tile-icon" viewBox="0 0 24 24"><path d="M12 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0zm5.01 4.744c.688 0 1.25.561 1.25 1.249a1.25 1.25 0 0 1-2.498.056l-2.597-.547-.8 3.747c1.824.07 3.48.632 4.674 1.488.308-.309.73-.491 1.207-.491.968 0 1.754.786 1.754 1.754 0 .716-.435 1.333-1.01 1.614a3.111 3.111 0 0 1 .042.52c0 2.694-3.13 4.87-7.004 4.87-3.874 0-7.004-2.176-7.004-4.87 0-.183.015-.366.043-.534A1.748 1.748 0 0 1 4.028 12c0-.968.786-1.754 1.754-1.754.463 0 .898.196 1.207.49 1.207-.883 2.878-1.43 4.744-1.487l.885-4.182a.342.342 0 0 1 .14-.197.35.35 0 0 1 .238-.042l2.906.617a1.214 1.214 0 0 1 1.108-.701z"/></svg>
                        <span class="tile-name">Reddit</span>
                    </div>
                    <span class="tile-code">02</span>
                </a>
                <a href="https://x.com" class="tech-tile">

                        <svg class="tile-icon" viewBox="0 0 24 24"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>

                </a>
                <a href="https://google.com" class="tech-tile">
                    <div class="tile-left">
                        <svg class="tile-icon" viewBox="0 0 24 24"><path d="M12.48 10.92v3.28h7.84c-.24 1.84-.853 3.187-1.787 4.133-1.147 1.147-2.933 2.4-6.053 2.4-4.827 0-8.6-3.893-8.6-8.72s3.773-8.72 8.6-8.72c2.6 0 4.507 1.027 5.907 2.347l2.307-2.307C18.747 1.44 16.133 0 12.48 0 5.867 0 .307 5.387.307 12s5.56 12 12.173 12c3.573 0 6.267-1.173 8.373-3.36 2.16-2.16 2.84-5.213 2.84-7.667 0-.76-.053-1.467-.173-2.053H12.48z"/></svg>

            </div>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-bar">
        WEBPULSE MATRIX v3.0 • GUDOV OS
    </div>

    <script>
        // 1. Digital 3D Synthwave Particle Canvas Animation
        const canvas = document.getElementById('particle-canvas');
        const ctx = canvas.getContext('2d');

        let width, height;
        const cols = 60;
        const rows = 35;
        let count = 0;
        let waveColor = 'rgba(0, 240, 255, ';

        function resizeCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function renderWave() {
            ctx.clearRect(0, 0, width, height);
            const spaceX = width / cols;
            const spaceY = height / rows;

            for (let x = 0; x < cols; x++) {
                for (let y = 0; y < rows; y++) {
                    const scale = y / rows;
                    const projY = scale * (height * 0.72) + (height * 0.28);
                    const projX = (x - cols / 2) * (spaceX * scale) + (width / 2);

                    const wave = Math.sin(count + x * 0.15 + y * 0.15) * 22 * scale;
                    const alpha = (0.12 + scale * 0.65).toFixed(2);

                    ctx.fillStyle = `${waveColor}${alpha})`;
                    ctx.beginPath();
                    ctx.arc(projX, projY + wave, Math.max(0.7, scale * 2.4), 0, Math.PI * 2);
                    ctx.fill();
                }
            }

            count += 0.025;
            requestAnimationFrame(renderWave);
        }
        renderWave();

        // 2. HUD Clock Update
        function updateHUDClock() {
            const now = new Date();
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');
            document.getElementById('top-clock').innerText = `${hours}:${minutes}:${seconds}`;
        }
        setInterval(updateHUDClock, 1000);
        updateHUDClock();

        // 3. Search Handler (Google, DuckDuckGo, Bing)
        const searchInput = document.getElementById('search');
        const engineSelect = document.getElementById('engine');

        const searchEngines = {
            google: "https://www.google.com/search?q=",
            duckduckgo: "https://duckduckgo.com/?q=",
            bing: "https://www.bing.com/search?q="
        };

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (!query) return;

                const isUrl = /^(https?:\/\/)?([\w-]+\.)+[\w-]+(\/.*)?$/i.test(query);

                if (query.startsWith('http://') || query.startsWith('https://')) {
                    window.location.href = query;
                } else if (isUrl && !query.includes(' ')) {
                    window.location.href = `https://${query}`;
                } else {
                    const engine = engineSelect.value;
                    const baseUrl = searchEngines[engine] || searchEngines.google;
                    window.location.href = `${baseUrl}${encodeURIComponent(query)}`;
                }
            }
        });

        // 4. Modal Launcher Controller
        const modal = document.getElementById('shortcut-modal');
        const openBtn = document.getElementById('open-modal-btn');
        const closeBtn = document.getElementById('close-modal-btn');

        openBtn.addEventListener('click', () => modal.classList.add('active'));
        closeBtn.addEventListener('click', () => modal.classList.remove('active'));
        modal.addEventListener('click', (e) => {
            if (e.target === modal) modal.classList.remove('active');
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === '/' && document.activeElement !== searchInput) {
                e.preventDefault();
                searchInput.focus();
            }
            if (e.key === 'Escape') modal.classList.remove('active');
        });

        // 5. Appearance Theme Switcher
        function setTheme(theme) {
            document.body.className = '';
            if (theme === 'light') {
                document.body.classList.add('theme-light');
                waveColor = 'rgba(0, 102, 255, ';
            } else if (theme === 'maroon') {
                document.body.classList.add('theme-maroon');
                waveColor = 'rgba(255, 0, 85, ';
            } else if (theme === 'cyan') {
                waveColor = 'rgba(0, 240, 255, ';
            } else {
                document.body.classList.add('theme-dark');
                waveColor = 'rgba(0, 240, 255, ';
            }
        }

        // 6. Geolocation Weather
        async function fetchWeather() {
            try {
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                
                if (geoData.latitude && geoData.longitude) {
                    const weatherRes = await fetch(
                        `https://api.open-meteo.com/v1/forecast?latitude=${geoData.latitude}&longitude=${geoData.longitude}&current_weather=true`
                    );
                    const weatherData = await weatherRes.json();
                    
                    if (weatherData.current_weather) {
                        const temp = Math.round(weatherData.current_weather.temperature);
                        document.getElementById('weather-temp').innerText = `${temp}°C`;
                        document.getElementById('weather-city').innerText = (geoData.city || 'LOCAL_NODE').toUpperCase();
                    }
                }
            } catch (err) {
                document.getElementById('weather-city').innerText = 'OFFLINE_NODE';
            }
        }
        fetchWeather();
    </script>
</body>
</html>
