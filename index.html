<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gudov — Smart New Tab</title>
    <!-- Modern Google Font: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #090d16;
            --card-bg: rgba(22, 30, 46, 0.7);
            --card-border: rgba(255, 255, 255, 0.08);
            --accent-glow: #38bdf8;
            --accent-purple: #818cf8;
            --text-primary: #f8fafc;
            --text-muted: #94a3b8;
            --input-bg: rgba(15, 23, 42, 0.8);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            overflow-x: hidden;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(56, 189, 248, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(129, 140, 248, 0.08) 0%, transparent 40%);
        }

        /* Top Bar */
        .top-bar {
            width: 100%;
            padding: 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }

        .brand-badge {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-weight: 700;
            font-size: 1.25rem;
            letter-spacing: -0.02em;
            color: var(--text-primary);
        }

        .brand-icon {
            width: 28px;
            height: 28px;
            background: linear-gradient(135deg, var(--accent-glow), var(--accent-purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.4);
        }

        .brand-icon::after {
            content: '';
            width: 10px;
            height: 10px;
            background: #fff;
            border-radius: 50%;
        }

        .weather-widget {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.5rem 1rem;
            border-radius: 2rem;
            backdrop-filter: blur(12px);
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .weather-temp {
            color: var(--text-primary);
            font-weight: 600;
        }

        /* Main Container */
        .main-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            max-width: 680px;
            padding: 2rem;
            z-index: 10;
        }

        /* Clock Section */
        .clock-section {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        #clock {
            font-size: 5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            background: linear-gradient(180deg, #ffffff 30%, #94a3b8 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1;
            margin-bottom: 0.75rem;
            text-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        #greeting {
            font-size: 1.25rem;
            color: var(--text-muted);
            font-weight: 400;
        }

        /* Search Card */
        .search-card {
            width: 100%;
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 0.5rem;
            border-radius: 1.25rem;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: border-color 0.3s, box-shadow 0.3s;
        }

        .search-card:focus-within {
            border-color: rgba(56, 189, 248, 0.4);
            box-shadow: 0 0 30px rgba(56, 189, 248, 0.15);
        }

        .engine-select {
            background: transparent;
            border: none;
            color: var(--accent-glow);
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            border-radius: 0.75rem;
            outline: none;
        }

        .engine-select option {
            background: #0f172a;
            color: #fff;
        }

        .search-input {
            flex: 1;
            padding: 0.75rem;
            border: none;
            background: transparent;
            color: var(--text-primary);
            font-size: 1.1rem;
            font-family: inherit;
            outline: none;
        }

        .search-input::placeholder {
            color: #475569;
        }

        .search-hint {
            padding: 0.4rem 0.8rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 0.5rem;
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-right: 0.5rem;
        }

        /* Quick Links Shortcuts Grid */
        .shortcuts-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1.25rem;
            margin-top: 3rem;
            width: 100%;
        }

        .shortcut-tile {
            background: var(--card-bg);
            border: 1px solid var(--card-border);
            padding: 1.25rem 1rem;
            border-radius: 1rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.6rem;
            text-decoration: none;
            color: var(--text-primary);
            backdrop-filter: blur(12px);
            transition: transform 0.2s, border-color 0.2s, background 0.2s;
        }

        .shortcut-tile:hover {
            transform: translateY(-4px);
            border-color: rgba(56, 189, 248, 0.3);
            background: rgba(30, 41, 59, 0.8);
        }

        .shortcut-icon {
            width: 40px;
            height: 40px;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .shortcut-title {
            font-size: 0.85rem;
            font-weight: 500;
            color: var(--text-muted);
        }

        /* Footer */
        .footer-info {
            padding: 1.5rem;
            color: #475569;
            font-size: 0.85rem;
            text-align: center;
            z-index: 10;
        }

        @media (max-width: 640px) {
            #clock { font-size: 3.5rem; }
            .shortcuts-grid { grid-template-columns: repeat(2, 1fr); }
            .main-container { padding: 1rem; }
        }
    </style>
</head>
<body>

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="brand-badge">
            <div class="brand-icon"></div>
            <span>Gudov</span>
        </div>
        
        <div class="weather-widget" id="weather">
            <span id="weather-icon">🌤️</span>
            <span class="weather-temp" id="weather-temp">--°C</span>
            <span id="weather-city">Fetching...</span>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-container">
        <div class="clock-section">
            <h1 id="clock">00:00</h1>
            <p id="greeting">Ready to start surfing?</p>
        </div>

        <div class="search-card">
            <select class="engine-select" id="engine" aria-label="Select Search Engine">
                <option value="google">Google</option>
                <option value="duckduckgo">DuckDuckGo</option>
                <option value="bing">Bing</option>
                <option value="youtube">YouTube</option>
            </select>
            <input type="text" class="search-input" id="search" placeholder="Type a search query or URL..." autofocus autocomplete="off">
            <span class="search-hint">Press ↵</span>
        </div>

        <!-- Customizable Shortcuts -->
        <div class="shortcuts-grid">
            <a href="https://github.com" class="shortcut-tile">
                <div class="shortcut-icon" style="color: #f0f6fc;">🐙</div>
                <span class="shortcut-title">GitHub</span>
            </a>
            <a href="https://youtube.com" class="shortcut-tile">
                <div class="shortcut-icon" style="color: #ff0000;">▶️</div>
                <span class="shortcut-title">YouTube</span>
            </a>
            <a href="https://reddit.com" class="shortcut-tile">
                <div class="shortcut-icon" style="color: #ff4500;">🤖</div>
                <span class="shortcut-title">Reddit</span>
            </a>
            <a href="https://x.com" class="shortcut-tile">
                <div class="shortcut-icon" style="color: #38bdf8;">⚡</div>
                <span class="shortcut-title">X / Twitter</span>
            </a>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer-info">
        Gudov Browser OS • Built for speed & simplicity
    </div>

    <script>
        // 1. Live Clock & Dynamic Greeting
        function updateClockAndGreeting() {
            const now = new Date();
            const hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            
            document.getElementById('clock').innerText = `${hours}:${minutes}`;

            let greetText = "Ready to start surfing?";
            if (hours >= 5 && hours < 12) {
                greetText = "Good morning! Ready to start surfing?";
            } else if (hours >= 12 && hours < 17) {
                greetText = "Good afternoon! Ready to start surfing?";
            } else if (hours >= 17 && hours < 22) {
                greetText = "Good evening! Ready to start surfing?";
            } else {
                greetText = "Night owl mode activated. Ready to start surfing?";
            }
            document.getElementById('greeting').innerText = greetText;
        }
        setInterval(updateClockAndGreeting, 1000);
        updateClockAndGreeting();

        // 2. Multi-Engine Search Redirect
        const searchInput = document.getElementById('search');
        const engineSelect = document.getElementById('engine');

        const searchEngines = {
            google: "https://www.google.com/search?q=",
            duckduckgo: "https://duckduckgo.com/?q=",
            bing: "https://www.bing.com/search?q=",
            youtube: "https://www.youtube.com/results?search_query="
        };

        searchInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                const query = searchInput.value.trim();
                if (!query) return;

                // URL detection pattern
                const isUrl = /^(https?:\/\/)?([\w-]+\.)+[\w-]+(\/.*)?$/i.test(query);

                if (query.startsWith('http://') || query.startsWith('https://')) {
                    window.location.href = query;
                } else if (isUrl && !query.includes(' ')) {
                    window.location.href = `https://${query}`;
                } else {
                    const engine = engineSelect.value;
                    const baseUrl = searchEngines[engine] || searchEngines.google;
                    window.location.href = `${baseUrl}${encodeURIComponent(query)}`;
                }
            }
        });

        // 3. Live Weather API (Public & Keyless API via Open-Meteo)
        async function fetchWeather() {
            try {
                // Approximate location via IP
                const geoRes = await fetch('https://ipapi.co/json/');
                const geoData = await geoRes.json();
                
                if (geoData.latitude && geoData.longitude) {
                    const weatherRes = await fetch(
                        `https://api.open-meteo.com/v1/forecast?latitude=${geoData.latitude}&longitude=${geoData.longitude}&current_weather=true`
                    );
                    const weatherData = await weatherRes.json();
                    
                    if (weatherData.current_weather) {
                        const temp = Math.round(weatherData.current_weather.temperature);
                        document.getElementById('weather-temp').innerText = `${temp}°C`;
                        document.getElementById('weather-city').innerText = geoData.city || 'Local';
                    }
                }
            } catch (err) {
                document.getElementById('weather-city').innerText = 'Offline';
            }
        }
        fetchWeather();
    </script>
</body>
</html>
