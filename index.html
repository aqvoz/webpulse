<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Gudov</title>


    <!-- Fonts -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet"
    >


    <!-- Icons -->

    <script src="https://unpkg.com/lucide@latest"></script>


    <style>

        /* =====================================================
           CORE
        ===================================================== */

        :root {

            --blue: #5dbbff;
            --blue-soft: rgba(93, 187, 255, 0.35);

            --white: #edf6ff;
            --muted: #8394a8;
            --dim: #425163;

            --line: rgba(145, 177, 207, 0.14);

            --panel: rgba(3, 10, 18, 0.68);

        }


        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }


        html,
        body {
            width: 100%;
            min-height: 100%;
        }


        body {

            min-height: 100vh;

            background:
                linear-gradient(
                    90deg,
                    rgba(2, 7, 14, .62),
                    rgba(2, 7, 14, .20),
                    rgba(2, 7, 14, .55)
                ),

                linear-gradient(
                    0deg,
                    rgba(2, 7, 14, .78),
                    transparent 55%,
                    rgba(2, 7, 14, .25)
                ),

                url("assets/background.jpg");

            background-size: cover;
            background-position: center;
            background-attachment: fixed;

            color: var(--white);

            font-family:
                "Inter",
                system-ui,
                sans-serif;

            overflow-x: hidden;
        }


        /* =====================================================
           AMBIENT LAYER
        ===================================================== */

        .noise {

            position: fixed;

            inset: 0;

            pointer-events: none;

            z-index: 20;

            opacity: .035;

            background-image:
                url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.5'/%3E%3C/svg%3E");
        }


        /* =====================================================
           SCAN LINE
        ===================================================== */

        .scanline {

            position: fixed;

            left: 0;
            right: 0;

            height: 1px;

            top: -10px;

            background:
                linear-gradient(
                    90deg,
                    transparent,
                    rgba(93,187,255,.25),
                    transparent
                );

            box-shadow:
                0 0 14px rgba(93,187,255,.18);

            pointer-events: none;

            z-index: 19;

            animation:
                scan 9s linear infinite;
        }


        @keyframes scan {

            0% {
                top: -10px;
                opacity: 0;
            }

            10% {
                opacity: .5;
            }

            90% {
                opacity: .5;
            }

            100% {
                top: 100%;
                opacity: 0;
            }

        }


        /* =====================================================
           TOP BAR
        ===================================================== */

        .top {

            height: 70px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                0 30px;

            border-bottom:
                1px solid var(--line);

            background:
                rgba(2, 7, 13, .52);

            backdrop-filter:
                blur(14px);

            position: relative;

            z-index: 10;
        }


        .brand {

            display: flex;

            align-items: center;

            gap: 12px;

            font-size: 17px;

            font-weight: 500;

            letter-spacing: -.03em;
        }


        .brand-line {

            width: 22px;

            height: 1px;

            background:
                var(--blue);

            box-shadow:
                0 0 9px var(--blue);
        }


        .brand small {

            color: var(--dim);

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 9px;

            margin-left: 4px;

            letter-spacing: .12em;
        }


        .top-right {

            display: flex;

            align-items: center;

            gap: 18px;

            color: var(--dim);

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 10px;

            letter-spacing: .08em;
        }


        .connection {

            display: flex;

            align-items: center;

            gap: 7px;
        }


        .connection-dot {

            width: 5px;
            height: 5px;

            border-radius: 50%;

            background: #65d6a1;

            box-shadow:
                0 0 9px #65d6a1;

            animation:
                pulse 2s ease-in-out infinite;
        }


        @keyframes pulse {

            0%,
            100% {
                opacity: .45;
            }

            50% {
                opacity: 1;
            }

        }


        /* =====================================================
           MAIN
        ===================================================== */

        main {

            position: relative;

            width:
                min(1180px, calc(100% - 70px));

            min-height:
                calc(100vh - 132px);

            margin: auto;

            display: flex;

            flex-direction: column;

            justify-content: center;
        }


        /* =====================================================
           LITTLE TECH MARKERS
        ===================================================== */

        .marker {

            position: absolute;

            display: flex;

            align-items: center;

            gap: 8px;

            color: rgba(166, 194, 219, .38);

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 8px;

            letter-spacing: .13em;

            text-transform: uppercase;

            pointer-events: none;
        }


        .marker::before {

            content: "";

            width: 18px;

            height: 1px;

            background:
                var(--blue-soft);
        }


        .marker.one {
            top: 16%;
            left: 0;
        }


        .marker.two {
            right: 0;
            top: 25%;
        }


        .marker.three {
            left: 4%;
            bottom: 13%;
        }


        /* =====================================================
           CLOCK
        ===================================================== */

        .clock-block {

            position: relative;

            width: fit-content;

            margin-left:
                clamp(0px, 8vw, 100px);

            margin-bottom: 42px;
        }


        .clock-label {

            margin-bottom: 9px;

            color: var(--blue);

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 9px;

            letter-spacing: .25em;

            text-transform: uppercase;

            opacity: .8;
        }


        #clock {

            font-size:
                clamp(5rem, 11vw, 9rem);

            line-height: .8;

            font-weight: 300;

            letter-spacing: -.075em;

            color: var(--white);

            text-shadow:
                0 0 40px rgba(93,187,255,.08);
        }


        #date {

            margin-top: 20px;

            color: #8192a7;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 10px;

            letter-spacing: .18em;

            text-transform: uppercase;
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-area {

            width:
                min(760px, 100%);

            margin-left:
                clamp(0px, 16vw, 190px);

            position: relative;
        }


        .search-shell {

            height: 62px;

            display: flex;

            align-items: center;

            position: relative;

            border:
                1px solid
                rgba(150,190,225,.23);

            background:
                rgba(2, 8, 16, .70);

            backdrop-filter:
                blur(18px);

            transition:
                border-color .25s,
                box-shadow .25s;
        }


        /* Corner details */

        .search-shell::before,
        .search-shell::after {

            content: "";

            position: absolute;

            width: 10px;
            height: 10px;

            pointer-events: none;
        }


        .search-shell::before {

            top: -1px;
            left: -1px;

            border-top:
                1px solid var(--blue);

            border-left:
                1px solid var(--blue);
        }


        .search-shell::after {

            right: -1px;
            bottom: -1px;

            border-right:
                1px solid var(--blue);

            border-bottom:
                1px solid var(--blue);
        }


        .search-shell:focus-within {

            border-color:
                rgba(93,187,255,.55);

            box-shadow:
                0 0 30px
                rgba(93,187,255,.08);
        }


        .search-icon {

            width: 18px;

            margin:
                0 15px 0 19px;

            color:
                var(--blue);

            opacity: .75;
        }


        #search {

            flex: 1;

            height: 100%;

            border: 0;
            outline: 0;

            background:
                transparent;

            color: var(--white);

            font-family:
                "Inter",
                sans-serif;

            font-size: 14px;
        }


        #search::placeholder {
            color: #5d7085;
        }


        .engine {

            height: 34px;

            padding:
                0 10px;

            margin-right: 8px;

            border:
                1px solid var(--line);

            border-radius: 4px;

            background:
                rgba(8,17,29,.8);

            color: #8ca0b5;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 9px;

            outline: none;

            cursor: pointer;
        }


        .engine option {

            background: #07101b;

            color: white;
        }


        .search-button {

            width: 42px;
            height: 42px;

            margin-right: 9px;

            display: grid;

            place-items: center;

            border: 1px solid
                rgba(93,187,255,.25);

            background:
                rgba(93,187,255,.07);

            color:
                var(--blue);

            cursor: pointer;

            transition:
                background .2s,
                border-color .2s,
                transform .2s;
        }


        .search-button:hover {

            background:
                rgba(93,187,255,.15);

            border-color:
                rgba(93,187,255,.55);

            transform:
                translateX(2px);
        }


        /* =====================================================
           QUICK ACCESS
        ===================================================== */

        .quick {

            width:
                min(760px, 100%);

            margin-left:
                clamp(0px, 16vw, 190px);

            margin-top: 25px;
        }


        .quick-header {

            display: flex;

            align-items: center;

            gap: 12px;

            margin-bottom: 10px;

            color: #60738a;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 8px;

            letter-spacing: .2em;

            text-transform: uppercase;
        }


        .quick-header span {

            width: 25px;

            height: 1px;

            background:
                var(--line);
        }


        .links {

            display: grid;

            grid-template-columns:
                repeat(4, 1fr);

            border-top:
                1px solid var(--line);

            border-left:
                1px solid var(--line);
        }


        .link {

            position: relative;

            min-height: 86px;

            padding:
                17px 18px;

            border-right:
                1px solid var(--line);

            border-bottom:
                1px solid var(--line);

            background:
                rgba(3,10,18,.42);

            color: var(--white);

            text-decoration: none;

            overflow: hidden;

            transition:
                background .25s,
                border-color .25s;
        }


        .link:hover {

            background:
                rgba(5,18,31,.70);

            border-color:
                rgba(93,187,255,.3);
        }


        /* Animated technical line */

        .link::before {

            content: "";

            position: absolute;

            left: 0;
            bottom: 0;

            width: 0;
            height: 1px;

            background:
                var(--blue);

            box-shadow:
                0 0 8px
                rgba(93,187,255,.5);

            transition:
                width .35s ease;
        }


        .link:hover::before {
            width: 100%;
        }


        /* Number */

        .link-number {

            position: absolute;

            right: 10px;
            top: 8px;

            color: #33465b;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 8px;
        }


        .link-icon {

            width: 20px;

            color: #8297ae;

            margin-bottom: 13px;

            transition:
                color .25s,
                transform .25s;
        }


        .link:hover .link-icon {

            color:
                var(--blue);

            transform:
                translateY(-2px)
                scale(1.12);
        }


        .link-name {

            font-size: 12px;

            font-weight: 500;
        }


        .link-url {

            margin-top: 4px;

            color: #52667c;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 8px;
        }


        .link-arrow {

            position: absolute;

            right: 12px;
            bottom: 10px;

            width: 12px;

            color: #465b72;

            opacity: 0;

            transform:
                translate(-4px, 4px);

            transition:
                opacity .2s,
                transform .2s;
        }


        .link:hover .link-arrow {

            opacity: 1;

            color:
                var(--blue);

            transform:
                translate(0,0);
        }


        /* =====================================================
           BOTTOM DATA
        ===================================================== */

        .bottom-data {

            position: fixed;

            bottom: 20px;

            left: 30px;
            right: 30px;

            display: flex;

            align-items: center;

            justify-content: space-between;

            color: #43566c;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 8px;

            letter-spacing: .12em;

            z-index: 5;
        }


        .bottom-left,
        .bottom-right {

            display: flex;

            align-items: center;

            gap: 14px;
        }


        .separator {

            width: 18px;

            height: 1px;

            background:
                var(--line);
        }


        /* =====================================================
           SETTINGS DRAWER
        ===================================================== */

        .settings-button {

            position: fixed;

            right: 26px;
            top: 87px;

            width: 38px;
            height: 38px;

            display: grid;

            place-items: center;

            border:
                1px solid var(--line);

            background:
                rgba(3,10,18,.55);

            color:
                #71859b;

            cursor: pointer;

            z-index: 30;

            transition:
                color .2s,
                border-color .2s,
                transform .2s;
        }


        .settings-button:hover {

            color:
                var(--blue);

            border-color:
                rgba(93,187,255,.4);

            transform:
                rotate(20deg);
        }


        .drawer {

            position: fixed;

            right: 0;
            top: 0;
            bottom: 0;

            width:
                min(360px, 90vw);

            padding: 30px;

            background:
                rgba(3,9,17,.96);

            border-left:
                1px solid var(--line);

            backdrop-filter:
                blur(25px);

            z-index: 40;

            transform:
                translateX(100%);

            transition:
                transform .35s
                cubic-bezier(.16,1,.3,1);
        }


        .drawer.open {

            transform:
                translateX(0);
        }


        .drawer-header {

            display: flex;

            justify-content:
                space-between;

            align-items: center;

            padding-bottom: 20px;

            border-bottom:
                1px solid var(--line);

            margin-bottom: 28px;
        }


        .drawer-title {

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 10px;

            letter-spacing: .2em;

            color:
                var(--blue);
        }


        .close-settings {

            width: 30px;
            height: 30px;

            display: grid;

            place-items: center;

            background:
                transparent;

            border:
                1px solid var(--line);

            color:
                var(--muted);

            cursor: pointer;
        }


        .setting-group {

            margin-bottom: 30px;
        }


        .setting-label {

            margin-bottom: 13px;

            color:
                #52667b;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 8px;

            letter-spacing: .2em;

            text-transform: uppercase;
        }


        .theme-buttons {

            display: grid;

            grid-template-columns:
                repeat(3,1fr);

            gap: 7px;
        }


        .theme-button {

            height: 50px;

            border:
                1px solid var(--line);

            background:
                #07101b;

            color:
                #71859b;

            cursor: pointer;

            font-family:
                "JetBrains Mono",
                monospace;

            font-size: 8px;

            transition:
                border-color .2s,
                color .2s;
        }


        .theme-button:hover,
        .theme-button.selected {

            border-color:
                rgba(93,187,255,.45);

            color:
                var(--blue);
        }


        .toggle-row {

            display: flex;

            align-items: center;

            justify-content: space-between;

            padding:
                13px 0;

            border-bottom:
                1px solid rgba(145,177,207,.07);
        }


        .toggle-name {

            color:
                #a1b0c0;

            font-size: 11px;
        }


        .toggle {

            position: relative;

            width: 32px;
            height: 17px;

            border:
                1px solid #334457;

            background:
                #0b1420;

            cursor: pointer;

            transition:
                background .2s,
                border-color .2s;
        }


        .toggle::after {

            content: "";

            position: absolute;

            width: 9px;
            height: 9px;

            left: 3px;
            top: 3px;

            background:
                #607389;

            transition:
                transform .2s,
                background .2s;
        }


        .toggle.active {

            border-color:
                rgba(93,187,255,.5);

            background:
                rgba(93,187,255,.12);
        }


        .toggle.active::after {

            transform:
                translateX(15px);

            background:
                var(--blue);

            box-shadow:
                0 0 8px
                rgba(93,187,255,.5);
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 800px) {

            .top {
                padding: 0 18px;
            }

            .top-right {
                display: none;
            }

            .settings-button {
                top: 86px;
                right: 18px;
            }

            main {
                width:
                    calc(100% - 36px);

                min-height:
                    calc(100vh - 132px);
            }

            .clock-block {
                margin-left: 0;
            }

            .search-area,
            .quick {
                margin-left: 0;
            }

            .links {
                grid-template-columns:
                    repeat(2,1fr);
            }

            .marker {
                display: none;
            }

            .bottom-data {
                left: 18px;
                right: 18px;
            }

        }


        @media (max-width: 480px) {

            #clock {
                font-size: 4.4rem;
            }

            .search-shell {
                height: 58px;
            }

            .engine {
                display: none;
            }

            .links {
                grid-template-columns:
                    1fr 1fr;
            }

            .link {
                min-height: 95px;
            }

            .bottom-right {
                display: none;
            }

        }

    </style>

</head>


<body>


    <!-- Ambient effects -->

    <div class="noise"></div>

    <div class="scanline"></div>


    <!-- =====================================================
         HEADER
    ====================================================== -->

    <header class="top">

        <div class="brand">

            <span class="brand-line"></span>

            <span>Gudov</span>

            <small>NEW TAB</small>

        </div>


        <div class="top-right">

            <div class="connection">

                <span class="connection-dot"></span>

                LOCAL

            </div>

            <span id="topTime">
                --:--
            </span>

        </div>

    </header>


    <!-- =====================================================
         SETTINGS
    ====================================================== -->

    <button
        class="settings-button"
        id="settingsButton"
        aria-label="Open settings"
    >

        <i data-lucide="sliders-horizontal"></i>

    </button>


    <aside
        class="drawer"
        id="settingsDrawer"
    >

        <div class="drawer-header">

            <span class="drawer-title">
                GUDOV / CONFIG
            </span>

            <button
                class="close-settings"
                id="closeSettings"
            >

                <i data-lucide="x"></i>

            </button>

        </div>


        <!-- Appearance -->

        <div class="setting-group">

            <div class="setting-label">
                Appearance
            </div>


            <div class="theme-buttons">

                <button
                    class="theme-button selected"
                    data-theme="space"
                >
                    SPACE
                </button>

                <button
                    class="theme-button"
                    data-theme="midnight"
                >
                    DARK
                </button>

                <button
                    class="theme-button"
                    data-theme="blue"
                >
                    BLUE
                </button>

            </div>

        </div>


        <!-- Clock -->

        <div class="setting-group">

            <div class="setting-label">
                Clock
            </div>


            <div class="toggle-row">

                <span class="toggle-name">
                    24 hour
                </span>

                <button
                    class="toggle active"
                    id="formatToggle"
                ></button>

            </div>


            <div class="toggle-row">

                <span class="toggle-name">
                    Seconds
                </span>

                <button
                    class="toggle"
                    id="secondsToggle"
                ></button>

            </div>

        </div>


        <!-- Interface -->

        <div class="setting-group">

            <div class="setting-label">
                Interface
            </div>


            <div class="toggle-row">

                <span class="toggle-name">
                    Scan animation
                </span>

                <button
                    class="toggle active"
                    id="scanToggle"
                ></button>

            </div>


            <div class="toggle-row">

                <span class="toggle-name">
                    Ambient grain
                </span>

                <button
                    class="toggle active"
                    id="grainToggle"
                ></button>

            </div>

        </div>

    </aside>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main>


        <!-- Technical markers -->

        <div class="marker one">
            SYSTEM / 01
        </div>

        <div class="marker two">
            NODE / ACTIVE
        </div>

        <div class="marker three">
            GUDOV / 001
        </div>


        <!-- =================================================
             CLOCK
        ================================================== -->

        <section class="clock-block">

            <div class="clock-label">
                Local time
            </div>


            <div id="clock">
                00:00
            </div>


            <div id="date">
                Loading...
            </div>

        </section>


        <!-- =================================================
             SEARCH
        ================================================== -->

        <form
            class="search-area"
            id="searchForm"
        >

            <div class="search-shell">

                <i
                    class="search-icon"
                    data-lucide="search"
                ></i>


                <input
                    id="search"
                    type="text"
                    placeholder="Search the web or enter a URL..."
                    autocomplete="off"
                    spellcheck="false"
                    autofocus
                >


                <select
                    class="engine"
                    id="engine"
                    aria-label="Search engine"
                >

                    <option value="google">
                        GOOGLE
                    </option>

                    <option value="duckduckgo">
                        DUCKDUCKGO
                    </option>

                    <option value="bing">
                        BING
                    </option>

                    <option value="youtube">
                        YOUTUBE
                    </option>

                </select>


                <button
                    class="search-button"
                    type="submit"
                    aria-label="Search"
                >

                    <i data-lucide="arrow-up-right"></i>

                </button>

            </div>

        </form>


        <!-- =================================================
             QUICK ACCESS
        ================================================== -->

        <section class="quick">

            <div class="quick-header">

                <span></span>

                Pinned

                <span></span>

            </div>


            <div class="links">


                <!-- GitHub -->

    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>


        /* =====================================================
           ICONS
        ===================================================== */

        lucide.createIcons();


        /* =====================================================
           CLOCK SETTINGS
        ===================================================== */

        let use24Hour = true;

        let showSeconds = false;


        const clock =
            document.getElementById("clock");

        const date =
            document.getElementById("date");

        const topTime =
            document.getElementById("topTime");


        function updateClock() {

            const now = new Date();


            let options = {

                hour: "2-digit",

                minute: "2-digit",

                hour12: !use24Hour

            };


            if (showSeconds) {

                options.second =
                    "2-digit";

            }


            const time =
                now.toLocaleTimeString(
                    [],
                    options
                );


            clock.textContent =
                time;


            topTime.textContent =
                time;


            date.textContent =
                now.toLocaleDateString(
                    [],
                    {
                        weekday: "short",
                        month: "short",
                        day: "2-digit",
                        year: "numeric"
                    }
                ).toUpperCase();

        }


        updateClock();

        setInterval(
            updateClock,
            1000
        );


        /* =====================================================
           SEARCH
        ===================================================== */

        const searchForm =
            document.getElementById(
                "searchForm"
            );


        const searchInput =
            document.getElementById(
                "search"
            );


        const engine =
            document.getElementById(
                "engine"
            );


        const searchEngines = {

            google:
                "https://www.google.com/search?q=",

            duckduckgo:
                "https://duckduckgo.com/?q=",

            bing:
                "https://www.bing.com/search?q=",

            youtube:
                "https://www.youtube.com/results?search_query="

        };


        searchForm.addEventListener(
            "submit",
            function(event) {

                event.preventDefault();


                const query =
                    searchInput.value.trim();


                if (!query) {

                    searchInput.focus();

                    return;

                }


                /*
                 * Complete URL
                 */

                if (
                    query.startsWith(
                        "https://"
                    ) ||
                    query.startsWith(
                        "http://"
                    )
                ) {

                    window.location.href =
                        query;

                    return;

                }


                /*
                 * Detect domains
                 */

                const isURL =
                    /^[\w-]+(\.[\w-]+)+(\/.*)?$/i
                        .test(query);


                if (
                    isURL &&
                    !query.includes(" ")
                ) {

                    window.location.href =
                        "https://" + query;

                    return;

                }


                /*
                 * Search engine
                 */

                const base =
                    searchEngines[
                        engine.value
                    ];


                window.location.href =
                    base +
                    encodeURIComponent(
                        query
                    );

            }
        );


        /* =====================================================
           CTRL + K
        ===================================================== */

        document.addEventListener(
            "keydown",
            function(event) {

                if (
                    (event.ctrlKey ||
                     event.metaKey) &&
                    event.key.toLowerCase() === "k"
                ) {

                    event.preventDefault();

                    searchInput.focus();

                }

            }
        );


        /* =====================================================
           SETTINGS DRAWER
        ===================================================== */

        const settingsButton =
            document.getElementById(
                "settingsButton"
            );


        const drawer =
            document.getElementById(
                "settingsDrawer"
            );


        const closeSettings =
            document.getElementById(
                "closeSettings"
            );


        settingsButton.addEventListener(
            "click",
            function() {

                drawer.classList.add(
                    "open"
                );

            }
        );


        closeSettings.addEventListener(
            "click",
            function() {

                drawer.classList.remove(
                    "open"
                );

            }
        );


        /* =====================================================
           24 HOUR TOGGLE
        ===================================================== */

        const formatToggle =
            document.getElementById(
                "formatToggle"
            );


        formatToggle.addEventListener(
            "click",
            function() {

                use24Hour =
                    !use24Hour;

                this.classList.toggle(
                    "active"
                );

                updateClock();

            }
        );


        /* =====================================================
           SECONDS TOGGLE
        ===================================================== */

        const secondsToggle =
            document.getElementById(
                "secondsToggle"
            );


        secondsToggle.addEventListener(
            "click",
            function() {

                showSeconds =
                    !showSeconds;

                this.classList.toggle(
                    "active"
                );

                updateClock();

            }
        );


        /* =====================================================
           SCAN ANIMATION
        ===================================================== */

        const scanToggle =
            document.getElementById(
                "scanToggle"
            );


        const scanline =
            document.querySelector(
                ".scanline"
            );


        scanToggle.addEventListener(
            "click",
            function() {

                this.classList.toggle(
                    "active"
                );


                if (
                    this.classList.contains(
                        "active"
                    )
                ) {

                    scanline.style.display =
                        "block";

                } else {

                    scanline.style.display =
                        "none";

                }

            }
        );


        /* =====================================================
           GRAIN
        ===================================================== */

        const grainToggle =
            document.getElementById(
                "grainToggle"
            );


        const noise =
            document.querySelector(
                ".noise"
            );


        grainToggle.addEventListener(
            "click",
            function() {

                this.classList.toggle(
                    "active"
                );


                noise.style.display =
                    this.classList.contains(
                        "active"
                    )
                        ? "block"
                        : "none";

            }
        );


        /* =====================================================
           BACKGROUND THEMES
        ===================================================== */

        const themeButtons =
            document.querySelectorAll(
                ".theme-button"
            );


        themeButtons.forEach(
            button => {

                button.addEventListener(
                    "click",
                    function() {

                        themeButtons.forEach(
                            b =>
                                b.classList.remove(
                                    "selected"
                                )
                        );


                        this.classList.add(
                            "selected"
                        );


                        const theme =
                            this.dataset.theme;


                        if (
                            theme === "midnight"
                        ) {

                            document.body.style.backgroundImage =
                                `
                                linear-gradient(
                                    rgba(2,7,14,.82),
                                    rgba(2,7,14,.92)
                                ),
                                url("assets/background.jpg")
                                `;

                        }


                        else if (
                            theme === "blue"
                        ) {

                            document.body.style.backgroundImage =
                                `
                                linear-gradient(
                                    rgba(0,25,45,.55),
                                    rgba(2,7,14,.75)
                                ),
                                url("assets/background.jpg")
                                `;

                        }


                        else {

                            document.body.style.backgroundImage =
                                `
                                linear-gradient(
                                    90deg,
                                    rgba(2,7,14,.62),
                                    rgba(2,7,14,.20),
                                    rgba(2,7,14,.55)
                                ),
                                linear-gradient(
                                    0deg,
                                    rgba(2,7,14,.78),
                                    transparent 55%,
                                    rgba(2,7,14,.25)
                                ),
                                url("assets/background.jpg")
                                `;

                        }

                    }
                );

            }
        );


    </script>
